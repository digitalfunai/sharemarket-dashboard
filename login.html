<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Finora professional Indian stock market platform - Login">
    <title>Login — Finora</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login_style.css">
    <link rel="stylesheet" href="css/signup_style.css">
</head>

<body>
    <div class="auth-wrapper">    
        <h1 class="auth-headline">Log in to Account</h1>
        <p class="auth-subheadline">Welcome, Please Log in to Your Account</p>    
        <div class="auth-card">
                        <div id="alertContainer"></div>

            <div class="demo-creds">
                <div class="demo-creds-title">
                    <i class="bi bi-info-circle"></i> Demo Credentials
                </div>
                <div class="demo-cred-item">
                    <i class="bi bi-envelope"></i> <strong>admin@test.com</strong>
                </div>
                <div class="demo-cred-item">
                    <i class="bi bi-key"></i> <strong>admin123</strong>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="bi bi-envelope me-2"></i>Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="admin@test.com"
                        required>
                    <div class="form-error" data-error="email"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>
                    <div class="form-error" data-error="password"></div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="loader"></span>
                    <span class="btn-text">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one now</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.querySelector('.loader').classList.add('active');

            await new Promise(resolve => setTimeout(resolve, 800));

            if (auth.login(email, password)) {
                showAlert('✓ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showAlert('✗ Invalid email or password. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.querySelector('.loader').classList.remove('active');
                document.getElementById('password').value = '';
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type} show">${message}</div>`;
            if (type === 'error') {
                setTimeout(() => {
                    container.innerHTML = '';
                }, 4000);
            }
        }
    </script>
</body>

</html>
