<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Finora professional Indian stock market platform - Sign Up">
    <title>Sign Up — Finora</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/signup_style.css">
</head>

<body>

    <div class="auth-wrapper">
        <h1 class="auth-headline">Create Account</h1>
        <p class="auth-subheadline">Join Finora and start your investing journey</p>

        <div class="auth-card">
            <div id="alertContainer"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">
                        <i class="bi bi-person me-2"></i>Full Name
                    </label>
                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>
                    <div class="form-error" data-error="fullName"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupEmail">
                        <i class="bi bi-envelope me-2"></i>Email Address
                    </label>
                    <input
                        type="email"
                        id="signupEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required>
                    <div class="form-error" data-error="signupEmail"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupPassword">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                    <input
                        type="password"
                        id="signupPassword"
                        class="form-control"
                        placeholder="Create a strong password"
                        required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Password must be at least 8 characters</div>
                    <div class="form-error" data-error="signupPassword"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <i class="bi bi-check-circle me-2"></i>Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required>
                    <div class="form-error" data-error="confirmPassword"></div>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="agreeTerms"
                        class="form-check-input"
                        required>
                    <label class="checkbox-label" for="agreeTerms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-signup" id="signupBtn">
                    <span class="loader"></span>
                    <span class="btn-text">
                        <i class="bi bi-check-lg me-2"></i>Create Account
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const passwordInput = document.getElementById('signupPassword');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 'weak';
            let text = 'Weak password';

            if (password.length >= 8) {
                const hasUppercase = /[A-Z]/.test(password);
                const hasNumbers = /\d/.test(password);
                const hasSpecialChar = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

                if ((hasUppercase || hasNumbers) && password.length >= 12) {
                    strength = 'good';
                    text = 'Strong password';
                } else if (hasNumbers || hasSpecialChar) {
                    strength = 'fair';
                    text = 'Fair password';
                } else {
                    strength = 'weak';
                    text = 'Weak password';
                }
            }

            strengthBar.className = `strength-bar ${strength}`;
            strengthText.className = `strength-text ${strength}`;
            strengthText.textContent = text;
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;

            if (!fullName || !email || !password || !confirmPassword) {
                showAlert('✗ Please fill in all fields', 'error');
                return;
            }

            if (fullName.length < 3) {
                showAlert('✗ Name must be at least 3 characters long', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showAlert('✗ Please enter a valid email address', 'error');
                return;
            }

            if (password.length < 8) {
                showAlert('✗ Password must be at least 8 characters long', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('✗ Passwords do not match', 'error');
                return;
            }

            if (!agreeTerms) {
                showAlert('✗ You must agree to the terms and conditions', 'error');
                return;
            }

            const signupBtn = document.getElementById('signupBtn');
            signupBtn.disabled = true;
            signupBtn.querySelector('.loader').classList.add('active');

            await new Promise(resolve => setTimeout(resolve, 1000));

            if (auth.signup(fullName, email, password)) {
                showAlert('✓ Account created successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                showAlert('✗ An account with this email already exists. Please use a different email.', 'error');
                signupBtn.disabled = false;
                signupBtn.querySelector('.loader').classList.remove('active');
            }
        });

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type} show">${message}</div>`;
            if (type === 'error') {
                setTimeout(() => {
                    container.innerHTML = '';
                }, 4000);
            }
        }
    </script>
</body>

</html>
